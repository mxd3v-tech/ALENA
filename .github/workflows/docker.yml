name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: mxd3v/alena

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Check release tag against installed version
        if: github.ref_type == 'tag'
        run: |
          python - <<'PYTHON'
          import os
          from checker.releases import APP_VERSION
          if os.environ['GITHUB_REF_NAME'] != f'v{APP_VERSION}':
              raise SystemExit(f'Expected tag v{APP_VERSION} from checker/changelog.json')
          PYTHON
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mxd3v-tech'
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # latest – с ветки по умолчанию; версии – с тега v1.2.3; короткий sha
          # остаётся всегда, чтобы можно было откатиться на конкретный коммит.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Слои с LibreOffice и шрифтами Microsoft весят под гигабайт и почти
          # не меняются – без кеша каждая сборка тянула бы их заново.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: verify
    if: github.ref_type == 'tag' && github.repository == 'mxd3v-tech/ALENA'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m checker.releases > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "АЛЁНА ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
